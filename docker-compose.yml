services:
  app:
    restart: always
    build:
      dockerfile: ./docker-build/Dockerfile
      context: ./
      target: app
    # environment:
    #   APPLICATION__DB__URL: postgresql+asyncpg://u:pwd@host:1234/name
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "8000:8000"
    develop:
      watch:
        # - action: sync+restart
        - action: sync
          path: ./application
          target: /application
        - action: rebuild
          path: ./poetry.lock
        - action: rebuild
          path: ./pyproject.toml


  worker:
    restart: always
    build:
      dockerfile: ./docker-build/Dockerfile
      context: ./
      target: worker
    depends_on:
      - redis
      - pg
    command: taskiq worker core.taskiq.broker:broker core.tasks
    scale: 1
    develop:
      watch:
        - action: sync+restart
          path: ./application/core/tasks
          target: /application/core/tasks
        - action: sync+restart
          path: ./application/core/taskiq
          target: /application/core/taskiq


  pg:
    image: postgres:17.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: fastapi_application
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "fastapi_application"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: elestio/pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./servers.json:/pgadmin4/servers.json

  redis:
    image: redis:8.6.3-trixie
    restart: always
    depends_on:
      pg:
        condition: service_healthy
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 128mb
      - --no-appendfsync-on-rewrite
      - "yes"

    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  loki:
    image: grafana/loki:3.7.7
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # restart: unless-stopped
    restart: always
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    # restart: unless-stopped
    restart: always
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
    depends_on:
      - loki
    # restart: unless-stopped
    restart: always
    networks:
      - monitoring


networks:
  monitoring:

volumes:
  pgdata:
  redis_data:
  loki-data:
  alloy-data:
  grafana-data: