[project]
name = "fastapi-application"
version = "0.1.0"
description = ""
authors = [
    {name = "JOXWORK",email = "joxwork1995@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.43,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "orjson (>=3.11.3,<4.0.0)",
    "greenlet (>=3.5.0,<4.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "redis (>=7.4.0,<8.0.0)",
    "taskiq (>=0.12.4,<0.13.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi-users[sqlalchemy] (>=15.0.5,<16.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-order (>=1.5.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"


[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"